<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoneyTrack - Controle Financeiro</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Importando a biblioteca Chart.js para os gráficos -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <header>
        <h1>MoneyTrack</h1>
        <p>Seu controle financeiro pessoal.</p>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="container">

        <!-- CARDS DE RESUMO -->
        <section class="cards">
            <div class="card">
                <h3>Saldo Total</h3>
                <p id="balance" class="balance">R$ 0,00</p>
            </div>
            <div class="card">
                <h3>Receitas</h3>
                <p id="total-income" class="income">R$ 0,00</p>
            </div>
            <div class="card">
                <h3>Despesas</h3>
                <p id="total-expense" class="expense">R$ 0,00</p>
            </div>
        </section>

        <!-- FORMULÁRIO DE TRANSAÇÕES -->
        <section class="transaction-section">
            <h2 class="section-title">Nova transação</h2>
            
            <form id="transaction-form">
                <div class="form-group">
                    <label for="description">Descrição</label>
                    <input type="text" id="description" placeholder="Ex: Salário, mercado..." required>
                </div>

                <div class="form-group">
                    <label for="amount">Valor (R$)</label>
                    <input type="number" id="amount" placeholder="Ex: 1500" min="0.01" step="0.01" required>
                </div>

                <div class="form-group">
                    <label for="type">Tipo</label>
                    <select id="type" required>
                        <option value="income">Receita</option>
                        <option value="expense">Despesa</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="category">Categoria</label>
                    <select id="category" required>
                        <option value="">Selecione uma categoria</option>
                        <option value="Salário">Salário</option>
                        <option value="Alimentação">Alimentação</option>
                        <option value="Transporte">Transporte</option>
                        <option value="Moradia">Moradia</option>
                        <option value="Lazer">Lazer</option>
                        <option value="Outros">Outros</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="date">Data</label>
                    <input type="date" id="date" required>
                </div>

                <button type="submit" class="btn-add">
                    Adicionar transação
                </button>
            </form>
        </section>

        <!-- SEÇÃO DE GRÁFICO -->
        <section class="chart-section" style="margin-top: 40px; background-color: #1f2937; padding: 25px; border-radius: 12px; border: 1px solid #374151; max-width: 400px; margin-left: auto; margin-right: auto;">
            <h2 class="section-title" style="text-align: center; font-size: 18px; margin-bottom: 15px;">Despesas por Categoria</h2>
            <canvas id="expenseChart"></canvas>
        </section>

        <!-- LISTA DE TRANSAÇÕES -->
        <section class="transactions-list-section" style="margin-top: 40px; background-color: #1f2937; padding: 25px; border-radius: 12px; border: 1px solid #374151;">
            <h2 class="section-title">Histórico de Transações</h2>
            <ul id="transactions" style="list-style: none; padding: 0;">
                <!-- As transações aparecerão aqui via JavaScript -->
            </ul>
        </section>
        <!-- RODAPÉ -->
        <footer style="text-align: center; margin-top: 50px; padding: 20px 0; border-top: 1px solid #374151; color: #9ca3af; font-size: 14px;">
            <p>&copy; 2026 <strong>SyncedCorp.</strong> Todos os direitos reservados.</p>
        </footer>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
